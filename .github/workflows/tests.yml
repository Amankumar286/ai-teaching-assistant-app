name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # tests/ covers chunk_document's structural logic (via app.rag.chunker,
        # which imports app.rag.parser -- parser.py eagerly imports
        # docx/fitz/pptx at module level, so those three are needed just to
        # import chunker, even though no test actually parses a file),
        # hybrid.py's BM25/RRF-fusion logic (rank_bm25 only -- chromadb and
        # sentence-transformers are imported lazily inside functions these
        # tests never call, see app/rag/retriever.py + embeddings.py), and
        # graph._strip_template_artifacts (app.agent.graph imports `ollama`
        # at module level -- a lightweight HTTP client, not the ML-heavy
        # deps, so it's cheap to add here without pulling in torch/
        # chromadb/sentence-transformers/streamlit too). Verified locally:
        # all tests pass with exactly this set installed, nothing more.
        run: pip install pytest rank_bm25 pymupdf python-pptx python-docx ollama

      - name: Run tests
        run: pytest tests/ -v
